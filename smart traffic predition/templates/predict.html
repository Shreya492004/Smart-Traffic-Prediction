<!DOCTYPE html>
<html>
<head>
    <title>Traffic Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='image/predit2.jpeg') }}") no-repeat center center/cover;
        }

        .overlay {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .predict-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            width: 450px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            color: white;
        }

        .form-control {
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .btn-predict {
            background-color: #00c6d7;
            border: none;
            border-radius: 20px;
            padding: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-predict:hover {
            background-color: #00a5b5;
        }

        .home-link {
            display: block;
            margin-top: 12px;
            color: white;
            text-decoration: none;
        }

        .section-title {
            margin-top: 15px;
            font-size: 14px;
            color: #00ffd5;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="overlay">
    <div class="predict-box">

        <h3>Traffic Prediction</h3>

        <!-- IMPORTANT: enctype added -->
        <form action="/predict" method="POST" enctype="multipart/form-data">

            <!-- -------- IMAGE UPLOAD -------- -->
            <div class="section-title">Upload Traffic Image (Optional)</div>
            <input type="file" name="image" class="form-control">

            <!-- -------- OR MANUAL INPUT -------- -->
            <div class="section-title">OR Enter Traffic Details</div>

            <!-- Date -->
            <input type="date" name="date" class="form-control">

            <!-- Day -->
            <select name="day" class="form-control">
                <option value="">Select Day</option>
                <option value="0">Monday</option>
                <option value="1">Tuesday</option>
                <option value="2">Wednesday</option>
                <option value="3">Thursday</option>
                <option value="4">Friday</option>
                <option value="5">Saturday</option>
                <option value="6">Sunday</option>
            </select>

            <!-- Vehicle Counts -->
            <input type="number" name="car" class="form-control" placeholder="Car Count">
            <input type="number" name="bike" class="form-control" placeholder="Bike Count">
            <input type="number" name="bus" class="form-control" placeholder="Bus Count">
            <input type="number" name="truck" class="form-control" placeholder="Truck Count">

            <!-- Total -->
            <input type="number" name="total_vehicle" class="form-control" placeholder="Total Vehicle Count (optional)">

            <!-- Time -->
            <input type="number" name="hour" class="form-control" placeholder="Hour (0-23)" min="0" max="23">
            <input type="number" name="minute" class="form-control" placeholder="Minute (0-59)" min="0" max="59">

            <button type="submit" class="btn btn-predict">Predict</button>

        </form>

        <a href="/" class="home-link">← Back to Home</a>

    </div>
</div>

</body>
</html>
