<!DOCTYPE html>
<html>
<head>
    <title>Signal Timing Result</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: url("{{ url_for('static', filename='image/trafic1.jpeg') }}") no-repeat center center/cover;
            font-family: Arial, sans-serif;
        }

        .overlay {
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            width: 400px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            text-align: center;
            color: white;
        }

        h2 {
            color: #00ffd5;
            margin-bottom: 20px;
        }

        .signal {
            font-size: 18px;
            margin: 10px 0;
        }

        .btn-custom {
            background-color: #00c6d7;
            border: none;
            border-radius: 20px;
            padding: 8px;
            width: 100%;
            font-weight: 500;
            margin-top: 15px;
        }

        .btn-custom:hover {
            background-color: #00a5b5;
        }

    </style>
</head>

<body>

<div class="overlay">
    <div class="result-box">

        <h2>🚦 Traffic Signal Control</h2>

        <p><strong>Predicted Traffic Level:</strong> {{ traffic }}</p>

        <div class="signal">🟢 Green Light: {{ green_time }} seconds</div>
        <div class="signal">🟡 Yellow Light: {{ yellow_time }} seconds</div>
        <div class="signal">🔴 Red Light: {{ red_time }} seconds</div>

        <a href="/predict" class="btn btn-custom">Make Another Prediction</a>
        <a href="/" class="btn btn-custom">Logout</a>

    </div>
</div>

</body>
</html>
